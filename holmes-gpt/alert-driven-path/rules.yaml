apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-alerts
  namespace: shop
  labels: {app: shop-alerts}
spec:
  groups:
  - name: shop.alerts
    rules:
    - alert: ShopDatabaseDown
      expr: kube_deployment_status_replicas_available{namespace="shop", deployment="postgres"} == 0
      for: 1m
      labels: {severity: critical, service: postgres}
      annotations:
        summary: "Postgres database in shop namespace has no available replicas"
    - alert: ShopApiDown
      expr: kube_deployment_status_replicas_available{namespace="shop", deployment="api"} == 0
      for: 1m
      labels: {severity: critical, service: api}
      annotations:
        summary: "shop api has no available replicas"
    - alert: ShopWorkerDown
      expr: kube_deployment_status_replicas_available{namespace="shop", deployment="worker"} == 0
      for: 1m
      labels: {severity: warning, service: worker}
      annotations:
        summary: "shop worker has no available replicas"
    - alert: ShopPodCrashLooping
      expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace="shop"}[10m])) > 3
      for: 1m
      labels: {severity: critical}
      annotations:
        summary: "Pod {{ $labels.pod }} in namespace shop is crash looping"

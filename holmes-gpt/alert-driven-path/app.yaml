apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shop
  labels: {app: postgres, tier: database}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata:
      labels: {app: postgres, tier: database}
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - {name: POSTGRES_PASSWORD, value: "sekret"}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        readinessProbe:
          tcpSocket: {port: 5432}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: shop, labels: {app: postgres}}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels: {app: api, tier: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api, tier: frontend}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "api: waiting for database";
          while true; do
            if nc -z -w 2 postgres 5432; then echo "$(date) api: db ok"; sleep 10;
            else echo "$(date) api: cannot reach postgres"; exit 1; fi
          done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shop
  labels: {app: worker, tier: backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata:
      labels: {app: worker, tier: backend}
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "worker: waiting for database";
          while true; do
            if nc -z -w 2 postgres 5432; then echo "$(date) worker: db ok"; sleep 10;
            else echo "$(date) worker: cannot reach postgres"; exit 1; fi
          done
